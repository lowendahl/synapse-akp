[project]
name = "kp-compiler"
version = "0.2.0"
description = "Knowledge Pack Compiler — transforms OKF canonical sources into immutable Knowledge Packs"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Patrik Lowendahl", email = "plwendahl@microsoft.com" }]

dependencies = [
    "pydantic>=2.0",
    "markdown-it-py>=3.0",
    "ruamel.yaml>=0.18",
    "spacy>=3.7",
    "rapidfuzz>=3.0",
    "networkx>=3.0",
    "fastembed>=0.3",
    "bm25s>=0.2",
    "usearch>=2.0",
    "duckdb>=1.0",
    "orjson>=3.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
kp = "kp_compiler.__main__:main"
kp-compile = "kp_compiler.cli:main"
kp-find = "kp_compiler.consumer.cli:main"
kp-explore = "kp_compiler.consumer.explorer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_compiler"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
