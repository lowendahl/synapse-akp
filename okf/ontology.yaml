# ─────────────────────────────────────────────────────────────
# Relationship Predicates
# ─────────────────────────────────────────────────────────────

predicates:

  references:
    description: "Generic reference — source mentions target"
    inverse: referenced_by
    constraints: {}

  operationalizes:
    description: "Source is the execution/implementation of target methodology"
    inverse: operationalized_by
    constraints:
      subject_types: [Process, Metric, KPI, Program, Doctrine]
      object_types: [Framework, Stage, Methodology]

  measures:
    description: "Source metric/KPI quantifies target concept"
    inverse: measured_by
    constraints:
      subject_types: [Metric, KPI]
      object_types: [Process, Stage, Outcome, Program]

  belongs_to:
    description: "Source is part of target (containment)"
    inverse: contains
    constraints: {}

  depends_on:
    description: "Source requires target to function correctly"
    inverse: depended_on_by
    constraints: {}

  causes:
    description: "Source is a direct causal driver of target"
    inverse: caused_by
    constraints: {}

  causal_signal:
    description: "Source is an indirect risk/opportunity signal for target (not direct evidence)"
    inverse: signaled_by
    constraints: {}

  evidenced_by:
    description: "Source concept is measurable via target evidence source"
    inverse: provides_evidence_for
    constraints:
      object_types: [Evidence_Source, Evidence_Map]

  supersedes:
    description: "Source replaces target (deprecation)"
    inverse: superseded_by
    constraints: {}

  extends:
    description: "Source builds upon or enriches target"
    inverse: extended_by
    constraints: {}

  informs:
    description: "Source provides input/context to target"
    inverse: informed_by
    constraints: {}

  gates:
    description: "Source must be satisfied before target can proceed"
    inverse: gated_by
    constraints: {}

  funds:
    description: "Source provides financial investment for target"
    inverse: funded_by
    constraints:
      subject_types: [Program]

# ─────────────────────────────────────────────────────────────
# Constraints
# ─────────────────────────────────────────────────────────────

constraints:

  id_format:
    pattern: "^(mcem|csu)\\.[a-z_]+\\.[a-z0-9-]+$"
    description: "IDs must be domain.category.slug in lowercase kebab"

  unique_ids:
    scope: "global"
    description: "No two objects may share the same ID across both packs"

  no_circular_depends_on:
    predicate: "depends_on"
    description: "depends_on relationships must form a DAG (no cycles)"

  cross_pack_direction:
    description: "Only csu.* may reference mcem.* (not vice versa)"
    rule: "If subject starts with 'mcem.' then object must also start with 'mcem.'"
