name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Lint ────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.4

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  # ── Architecture boundary enforcement ─────────────────────
  architecture:
    name: Architecture Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run architecture boundary tests
        run: pytest tests/test_architecture.py -v

  # ── Test matrix ─────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('compiler/pyproject.toml') }}
          restore-keys: pip-${{ matrix.python-version }}-

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest --cov=kp_compiler --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: compiler/coverage.xml
          retention-days: 14

  # ── Build pack (integration smoke test) ─────────────────────
  build-packs:
    name: Build Knowledge Packs
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-3.12-${{ hashFiles('compiler/pyproject.toml') }}
          restore-keys: pip-3.12-

      - name: Install package
        run: pip install -e .

      - name: Compile MCEM pack
        run: kp compile ../okf/mcem

      - name: Compile CSU pack (with MCEM dependency)
        run: kp compile ../okf/csu

      - name: Verify pack artifacts
        run: |
          test -f ../dist/kp-mcem.duckdb || { echo "MCEM pack missing"; exit 1; }
          test -f ../dist/kp-csu.duckdb  || { echo "CSU pack missing";  exit 1; }
          python -c "
          import duckdb
          for pack in ['../dist/kp-mcem.duckdb', '../dist/kp-csu.duckdb']:
              con = duckdb.connect(pack, read_only=True)
              nodes = con.execute('SELECT count(*) FROM objects').fetchone()[0]
              edges = con.execute('SELECT count(*) FROM edges').fetchone()[0]
              xrefs = con.execute('SELECT count(*) FROM cross_pack_refs').fetchone()[0]
              print(f'{pack}: {nodes} nodes, {edges} edges, {xrefs} cross-pack refs')
              assert nodes > 0, f'No nodes in {pack}'
              assert edges > 0, f'No edges in {pack}'
              con.close()
          "

      - name: Generate explorer
        run: kp-explore ../dist/kp-csu.duckdb ../dist/kp-mcem.duckdb -o ../dist/pack-explorer.html

      - name: Upload pack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-packs
          path: |
            dist/kp-csu.duckdb
            dist/kp-mcem.duckdb
            dist/pack-explorer.html
          retention-days: 30

  # ── Package build check ─────────────────────────────────────
  package:
    name: Package Build
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build wheel & sdist
        run: python -m build

      - name: Verify wheel contents
        run: |
          pip install dist/*.whl
          kp --help
          kp-explore --help
