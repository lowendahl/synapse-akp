[project]
name = "akp-runtime"
version = "0.1.0"
description = "AKP Runtime — hybrid retrieval MCP server for compiled Knowledge Packs"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Patrik Lowendahl", email = "plwendahl@microsoft.com" }]

dependencies = [
    "pydantic>=2.0",
    "duckdb>=1.0",
    "bm25s>=0.2",
    "fastembed>=0.3",
    "usearch>=2.0",
    "mcp>=1.0",
    "orjson>=3.9",
    "numpy>=1.26",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
akp-runtime = "akp_runtime.__main__:main"
akp-runtime-mcp = "akp_runtime.consumer.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akp_runtime"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
