server_name: akp-runtime
default_limit: 10
lexical_k: 20
semantic_k: 20
graph_boost_top_n: 3
graph_boost_value: 0.1
rrf_k: 60
max_hops: 3
embeddings_enabled: false
pack_cache_directory: ~/.akp/packs

packs:
  - pack_id: mcem
    # Primary: GitHub release (auto-downloads .akp on first use)
    source: github://mcaps-microsoft/csu-iq-akp-repository/releases/latest/mcem.akp
    # Fallback: local development build
    fallback: ../dist/mcem.akp
    # Legacy: bare .duckdb also works (backward compat)
    path: ../dist/mcem.duckdb
    required: true

  - pack_id: csu
    source: github://mcaps-microsoft/csu-iq-akp-repository/releases/latest/csu.akp
    fallback: ../dist/csu.akp
    path: ../dist/csu.duckdb
    required: true
